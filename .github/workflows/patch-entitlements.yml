name: Patch App Sandbox Entitlements

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Luma entitlements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("Luma.xcodeproj/project.pbxproj")
          text = path.read_text()

          setting = "CODE_SIGN_ENTITLEMENTS = Luma/Luma.entitlements;"
          if setting in text:
              print("Entitlements setting already present; nothing to do.")
              raise SystemExit(0)

          marker = "PRODUCT_BUNDLE_IDENTIFIER = by.nevermind.Luma;"
          positions = []
          start = 0
          while True:
              index = text.find(marker, start)
              if index == -1:
                  break
              positions.append(index)
              start = index + len(marker)

          if len(positions) != 2:
              raise SystemExit(f"Expected two Luma application configurations, found {len(positions)}.")

          replacement = setting + "\n\t\t\t\t" + marker
          first = positions[0]
          second = positions[1]
          text = text[:second] + replacement + text[second + len(marker):]
          text = text[:first] + replacement + text[first + len(marker):]

          path.write_text(text)
          print("Patched CODE_SIGN_ENTITLEMENTS for Luma Debug and Release.")
          PY

      - name: Commit and remove migration workflow
        shell: bash
        run: |
          if git diff --quiet -- Luma.xcodeproj/project.pbxproj; then
            echo "No project changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Luma.xcodeproj/project.pbxproj
          git rm .github/workflows/patch-entitlements.yml
          git commit -m "Wire App Sandbox entitlements into Luma target"
          git push
