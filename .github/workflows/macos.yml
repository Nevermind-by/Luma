name: Сборка macOS

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Сборка
        run: |
          xcodebuild \
            -project Luma.xcodeproj \
            -scheme Luma \
            -destination 'platform=macOS' \
            build

      - name: Тесты
        run: |
          xcodebuild \
            -project Luma.xcodeproj \
            -scheme Luma \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            test

  package-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: macos-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Определить версию
        run: |
          set -euo pipefail
          VERSION="$(
            xcodebuild \
              -project Luma.xcodeproj \
              -scheme Luma \
              -configuration Release \
              -showBuildSettings |
              awk -F ' = ' '$1 ~ /MARKETING_VERSION$/ {print $2; exit}'
          )"
          test -n "$VERSION"
          echo "LUMA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Создать архив Release-сборки
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project Luma.xcodeproj \
            -scheme Luma \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            archive \
            -archivePath build/Luma.xcarchive

      - name: Проверить конфигурацию релиза
        run: |
          set -euo pipefail

          APP="build/Luma.xcarchive/Products/Applications/Luma.app"
          test -d "$APP"

          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")"
          VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          BUILD="$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")"
          ICON="$(plutil -extract CFBundleIconName raw -o - "$APP/Contents/Info.plist")"

          test "$BUNDLE_ID" = "by.nevermind.Luma"
          test "$VERSION" = "$LUMA_VERSION"
          test -n "$BUILD"
          test "$ICON" = "AppIcon"

          SETTINGS="$(
            xcodebuild \
              -project Luma.xcodeproj \
              -scheme Luma \
              -configuration Release \
              -showBuildSettings
          )"

          grep -q 'ENABLE_APP_SANDBOX = YES' <<< "$SETTINGS"
          grep -q 'ENABLE_HARDENED_RUNTIME = YES' <<< "$SETTINGS"
          grep -q 'CODE_SIGN_ENTITLEMENTS = Luma/Luma.entitlements' <<< "$SETTINGS"
          grep -q 'MACOSX_DEPLOYMENT_TARGET = 14.0' <<< "$SETTINGS"

          /usr/libexec/PlistBuddy -c "Print :com.apple.security.app-sandbox" Luma/Luma.entitlements | grep -q "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.network.client" Luma/Luma.entitlements | grep -q "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.files.downloads.read-write" Luma/Luma.entitlements | grep -q "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.files.user-selected.read-write" Luma/Luma.entitlements | grep -q "true"

          echo "Validated Luma $VERSION ($BUILD), bundle $BUNDLE_ID"
          echo "Release archive is intentionally unsigned in this workflow."

      - name: Создать ZIP
        run: |
          set -euo pipefail
          mkdir -p build/package
          ditto -c -k --sequesterRsrc --keepParent \
            build/Luma.xcarchive/Products/Applications/Luma.app \
            "build/package/Luma-macOS-$LUMA_VERSION-unsigned.zip"

      - name: Создать DMG
        run: |
          set -euo pipefail
          hdiutil create \
            -volname "Luma $LUMA_VERSION" \
            -srcfolder build/Luma.xcarchive/Products/Applications \
            -ov \
            -format UDZO \
            "build/package/Luma-macOS-$LUMA_VERSION-unsigned.dmg"

      - name: Проверить артефакты
        run: |
          set -euo pipefail

          ZIP="build/package/Luma-macOS-$LUMA_VERSION-unsigned.zip"
          DMG="build/package/Luma-macOS-$LUMA_VERSION-unsigned.dmg"

          test -s "$ZIP"
          test -s "$DMG"

          unzip -l "$ZIP" | grep -q 'Luma.app/'
          unzip -l "$ZIP" | grep -q 'Luma.app/Contents/Info.plist'

          MOUNT_POINT="$RUNNER_TEMP/luma-dmg"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"

          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true' EXIT

          test -d "$MOUNT_POINT/Luma.app"
          test -f "$MOUNT_POINT/Luma.app/Contents/Info.plist"

          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

      - name: Создать контрольные суммы
        run: |
          set -euo pipefail
          cd build/package
          shasum -a 256 * > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Загрузить артефакты CI
        uses: actions/upload-artifact@v4
        with:
          name: Luma-macOS-unsigned
          path: build/package/
          if-no-files-found: error
